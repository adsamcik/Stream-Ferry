name: Public release

# A signed semantic-version tag creates a public GitHub Release with a directly installable APK,
# checksum, and signer report.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vMAJOR.MINOR.PATCH tag to release."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: public-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag="${tag#refs/tags/}"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must be vMAJOR.MINOR.PATCH without leading zeroes (received: $tag)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Configure required release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "::error::A required release-signing secret is missing."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/stream-ferry-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build signed APK
        uses: ./.github/actions/gradle-retry
        with:
          args: >-
            -PversionName=${{ steps.release.outputs.version }}
            assembleRelease

      - name: Package release assets and signer identity
        id: assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          apk_source="app/build/outputs/apk/release/app-release.apk"
          metadata_source="app/build/outputs/apk/release/output-metadata.json"
          test -f "$metadata_source"
          test -f "$apk_source"
          apk="stream-ferry-${TAG}.apk"
          checksum="stream-ferry-${TAG}.sha256"
          certificate="stream-ferry-${TAG}-signing-certificate.txt"
          version_code="$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['elements'][0]['versionCode'])" "$metadata_source")"
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::APK metadata contains an invalid versionCode: $version_code"
            exit 1
          fi
          cp "$apk_source" "$apk"
          sha256sum "$apk" > "$checksum"
          keytool -printcert -jarfile "$apk" > "$certificate"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "certificate=$certificate" >> "$GITHUB_OUTPUT"

      - name: Create or update public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION_CODE: ${{ steps.assets.outputs.version_code }}
          APK: ${{ steps.assets.outputs.apk }}
          CHECKSUM: ${{ steps.assets.outputs.checksum }}
          CERTIFICATE: ${{ steps.assets.outputs.certificate }}
        run: |
          notes=release-notes.md
          version="${TAG#v}"
          if [[ -f CHANGELOG.md ]]; then
            awk -v hdr="## [$version]" '
              index($0, hdr) == 1 { capture = 1; next }
              capture && index($0, "## [") == 1 { exit }
              capture { print }
            ' CHANGELOG.md > "$notes"
          fi
          sed -i '/./,$!d' "$notes" 2>/dev/null || true
          if [[ ! -s "$notes" ]]; then
            echo "Stream Ferry $TAG" > "$notes"
          fi
          cat >> "$notes" <<EOF

          ---
          Direct APK: \`$APK\` (R8-minified, version code $VERSION_CODE).

          Verify the APK with the attached SHA-256 checksum and signing-certificate report. The public
          certificate is also committed as [docs/release-signing-certificate.pem](docs/release-signing-certificate.pem).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes" --prerelease=false
            gh release upload "$TAG" "$APK" "$CHECKSUM" "$CERTIFICATE" --clobber
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" "$CERTIFICATE" \
              --title "$TAG" --notes-file "$notes"
          fi

      - name: Remove temporary signing configuration
        if: ${{ always() }}
        run: rm -f keystore.properties
