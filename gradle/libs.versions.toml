[versions]
# Verified locally: Kotlin 2.4.0 (kotlinc on the build host), Android SDK Platform 37 / build-tools 37.0.0 present.
# AGP 9.2.1 supports compileSdk 37 (developer.android.com AGP 9.2 release notes); requires Gradle >= 9.4.1 (wrapper pins 9.5.1).
agp = "9.3.1"
kotlin = "2.4.10"

# AndroidX / Compose. Compose BOM + Cast versions must be re-verified at first online build
# (this sandbox blocks dl.google.com, so they could not be resolved here — see docs/BUILD.md).
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
# The alpha BOM is required for the official Material 3 Expressive theme, motion scheme, and
# morphing loading indicator. Keep the whole Compose stack aligned instead of pinning Material 3
# independently against an older Compose runtime.
composeBom = "2026.08.00"

# Google Cast Sender SDK (Google Play services).
castFramework = "22.3.1"

# Jellyfin official Kotlin SDK — VERIFIED on Maven Central: org.jellyfin.sdk:jellyfin-core:1.8.12, LGPL-3.0.
jellyfinSdk = "1.8.12"

# Networking / serialization (Maven Central).
okhttp = "5.4.0"
coroutines = "1.11.0"
serialization = "1.11.0"

# Image loading for in-app posters/thumbnails (Maven Central). Coil shares the app OkHttp client so the
# Jellyfin token is sent only as a header (never in the image URL), and is configured memory-cache-only.
coil = "2.7.0"

# On-device hardware transcoding (AndroidX Media3 Transformer; resolves from google()).
media3 = "1.11.0"

# Testing.
junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
robolectric = "4.16.1"
mockk = "1.14.11"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

compose-bom = { module = "androidx.compose:compose-bom-alpha", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

play-services-cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "castFramework" }

jellyfin-core = { module = "org.jellyfin.sdk:jellyfin-core", version.ref = "jellyfinSdk" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

androidx-media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
androidx-media3-muxer = { module = "androidx.media3:media3-muxer", version.ref = "media3" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
