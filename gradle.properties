org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Checked-in application version. Release tags and CI verify this exact value before publishing;
# -PversionName remains available to prove the tag and Gradle configuration agree.
versionName=0.5.0

# Resilience to transient dependency-resolution failures (network blips, slow
# mirrors): retry artifact downloads with backoff and use generous HTTP timeouts
# so a momentary hiccup against google()/mavenCentral() doesn't fail the build.
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=1000
org.gradle.internal.repository.max.backoff=16000
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
